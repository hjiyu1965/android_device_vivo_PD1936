name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'TWRP branch (twrp-11 for Android 11)'
        required: true
        default: 'twrp-11'
      DEVICE_TREE_URL:
        description: 'Device tree repo URL'
        required: true
        default: 'https://github.com/hjiyu1965/android_device_vivo_PD1936'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'twrp-11'
      DEVICE_PATH:
        description: 'Device tree path in source'
        required: true
        default: 'device/vivo/PD1936'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'PD1936'
      MAKEFILE_NAME:
        description: 'Makefile name (twrp_PD1936)'
        required: true
        default: 'twrp_PD1936'
      BUILD_TARGET:
        description: 'Build target (recovery or boot)'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Show build parameters
        run: |
          echo "::group::Build Environment"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
              libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
              xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
              build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
              imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "hjiyu1965"
          git config --global user.email "hjiyu1965@users.noreply.github.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Sync source
        run: |
          repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: Clone device tree
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Sync device dependencies
        run: |
          if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies ]; then
            bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies
            repo sync -j$(nproc --all) || true
          else
            echo "No dependencies file found, skipping"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        continue-on-error: true

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}_${{ github.event.inputs.MANIFEST_BRANCH }}_${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            ## vivo PD1936 (V1936A) TWRP Recovery

            **Build info:**
            - Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            - Device: ${{ github.event.inputs.DEVICE_NAME }}
            - Target: ${{ github.event.inputs.BUILD_TARGET }}.img

            **Features:**
            - FBE (File-Based Encryption) decryption support
            - Qualcomm QSEE / Keymaster 4.0 / Gatekeeper 1.0
            - vivo proprietary decryption chain (vivofbe, libvivofscrypt)
            - Non-A/B partition scheme
            - F2FS userdata

            **Usage:**
            1. Download recovery.img
            2. Flash with: fastboot flash recovery recovery.img
            3. Reboot to recovery mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
